name: H3 4D Spacetime Tensor Engine

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: spacetime-tensor-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/spacetime_tensor.db
          key: spacetime-tensor-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            spacetime-tensor-db-${{ runner.os }}-
            spacetime-tensor-db-

      - name: Execute 4D Spacetime Tensor Engine
        run: |
          if [ -f tensor_engine.py ]; then
            python tensor_engine.py
          else
            echo "tensor_engine.py not found"
          fi

      - name: Ensure Public Directory Exists
        run: |
          mkdir -p public
          touch public/.nojekyll

      - name: Create Fallback Index Page
        run: |
          if [ ! -f public/index.html ]; then

            echo '<!DOCTYPE html>' > public/index.html
            echo '<html lang="en">' >> public/index.html
            echo '<head>' >> public/index.html
            echo '  <meta charset="UTF-8">' >> public/index.html
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">' >> public/index.html
            echo '  <title>H3 4D Spacetime Tensor Engine</title>' >> public/index.html
            echo '  <style>' >> public/index.html
            echo '    body {' >> public/index.html
            echo '      background:#020617;' >> public/index.html
            echo '      color:#ffffff;' >> public/index.html
            echo '      margin:40px;' >> public/index.html
            echo '      font-family:system-ui,sans-serif;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    .card {' >> public/index.html
            echo '      max-width:900px;' >> public/index.html
            echo '      margin:auto;' >> public/index.html
            echo '      padding:24px;' >> public/index.html
            echo '      border-radius:12px;' >> public/index.html
            echo '      background:#111827;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    h1 {' >> public/index.html
            echo '      color:#38bdf8;' >> public/index.html
            echo '    }' >> public/index.html
            echo '  </style>' >> public/index.html
            echo '</head>' >> public/index.html
            echo '<body>' >> public/index.html
            echo '  <div class="card">' >> public/index.html
            echo '    <h1>H3 4D Spacetime Tensor Engine</h1>' >> public/index.html
            echo '    <p>Tensor compilation engine active.</p>' >> public/index.html
            echo '    <p>Spacetime ledger generated successfully.</p>' >> public/index.html
            echo '    <p>Generated by GitHub Actions.</p>' >> public/index.html
            echo '  </div>' >> public/index.html
            echo '</body>' >> public/index.html
            echo '</html>' >> public/index.html

          fi

      - name: Validate Public Directory
        run: |
          echo "===== PUBLIC DIRECTORY ====="

          find public -type f

          test -d public
          test -f public/index.html

          if [ ! -s public/index.html ]; then
            echo "index.html is empty"
            exit 1
          fi

      - name: Commit and Push Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history/ || true
          [ -d public ] && git add public/ || true

          if git diff --cached --quiet; then

            echo "No 4D spacetime anomalies to commit."

          else

            git commit -m "chore(history): record 4D spacetime tensor drift [skip ci]" || true

            git pull --rebase --autostash origin "${{ github.ref_name }}" || true

            git push origin HEAD:${{ github.ref_name }} || true

          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages Payload
        run: |
          echo "===== DEPLOYMENT PAYLOAD ====="

          find public -type f

          if [ ! -f public/index.html ]; then
            echo "Pages payload missing"
            exit 1
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment Complete"
          echo "${{ steps.deployment.outputs.page_url }}"
