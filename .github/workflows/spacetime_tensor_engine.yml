name: H3 4D Spacetime Tensor Engine

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: h3-4d-spacetime-tensor
  cancel-in-progress: true

jobs:
  ingest-and-build:
    name: Ingest and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore Database Cache
        uses: actions/cache@v4
        with:
          path: data/spacetime_tensor.db
          key: spacetime-tensor-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            spacetime-tensor-db-${{ runner.os }}-
            spacetime-tensor-db-

      - name: Execute H3 4D Spacetime Tensor Engine
        run: |
          mkdir -p data public
          if [ -f tensor_engine.py ]; then
            python tensor_engine.py
          elif [ -f h3_tensor_engine.py ]; then
            python h3_tensor_engine.py
          elif [ -f main.py ]; then
            python main.py
          else
            echo "Engine entrypoint not found"
          fi

      - name: Create Pages Output
        run: |
          mkdir -p public
          touch public/.nojekyll

          if [ ! -s public/index.html ]; then
            cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>H3 4D Spacetime Tensor Engine</title>
            <style>
              body {
                font-family: system-ui, sans-serif;
                margin: 40px;
                background: #090d16;
                color: #f8fafc;
              }
              .card {
                max-width: 900px;
                margin: auto;
                padding: 24px;
                background: #111827;
                border-radius: 12px;
              }
              h1 {
                color: #38bdf8;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>H3 4D Spacetime Tensor Engine</h1>
              <p>4D spatiotemporal tensor pipeline active.</p>
              <p>Historical ledger successfully published.</p>
              <p>Generated automatically by GitHub Actions.</p>
            </div>
          </body>
          </html>
          EOF
          fi

      - name: Validate Pages Payload
        run: |
          set -e
          test -d public
          test -f public/index.html
          test -s public/index.html

          echo "===== PUBLIC ====="
          find public -type f

          echo "===== SIZE ====="
          wc -c public/index.html

      - name: Commit Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history || true
          [ -d public ] && git add public || true

          if git diff --cached --quiet; then
            echo "No spacetime tensor updates."
          else
            git commit -m "chore(history): record spacetime tensor updates [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: ingest-and-build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15

      - name: Deployment Summary
        run: |
          echo "H3 4D Spacetime Tensor Engine — Deployment Complete"
          echo "${{ steps.deployment.outputs.page_url }}"
